  <rect x="10" y="12" width="2.5" height="9" rx="0.5" fill="url(#logoGradient)" />
  <rect x="14" y="8" width="2.5" height="13" rx="0.5" fill="url(#logoGradient)" />
  <rect x="18" y="4" width="2.5" height="17" rx="0.5" fill="url(#logoGradient)" />

  <!-- Elemento de Reporte/Auditoría: Lupa minimalista -->
